spring.application.name=portfolio-api
server.port=${PORT:8081}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Datasource Configuration
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/portfolio?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Custom Application Keys
app.admin-key=${ADMIN_KEY:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://jmr-dev-portfolio-gilt.vercel.app,http://localhost:5173}

# Notification Service Config
app.notify.resend-api-key=${RESEND_API_KEY:}
app.notify.to=${NOTIFY_EMAIL:ragipalyamjaganmohanreddy@gmail.com}
app.notify.from=${NOTIFY_FROM:Portfolio <onboarding@resend.dev>}
app.notify.site-url=${SITE_URL:https://jmr-dev-portfolio-gilt.vercel.app}